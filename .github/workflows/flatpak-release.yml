name: Flatpak Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update apt repository
        run: sudo apt-get update

      - name: Install flatpak
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub repository
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime
        run: |
            sudo flatpak install -y flathub org.gnome.Platform//51
            sudo flatpak install -y flathub org.gnome.Sdk//51

      - name: Install meson
        run: sudo apt-get install -y meson ninja-build

      - name: Download meson wraps
        run: meson subprojects download

      - name: Build release
        run: |
            flatpak-builder \
              --force-clean \
              --repo=artifact \
              build-dir \
              flatpak/net.kanashimo.pengui.yml

      - name: Bundle release
        run: flatpak build-bundle artifact pengui.flatpak net.kanashimo.pengui

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: pengui.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
