id: net.kanashimo.pengui
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pengui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_TESTS=OFF3
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/glfw/glfw
        tag: '3.4'

  - name: xxd
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/vim/vim
        tag: v9.1.0000
    build-commands:
      - make -C src xxd/xxd
      - install -Dm755 src/xxd/xxd /app/bin/xxd

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dfishcompletiondir=no
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard
        tag: v2.3.0

  - name: libXmu
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxmu
        tag: libXmu-1.3.1

  - name: xclip
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/astrand/xclip
        tag: '0.13'

  - name: zenity
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/GNOME/zenity
        tag: 4.2.2

  - name: pengui
    buildsystem: meson
    sources:
      - type: dir
        path: ..
